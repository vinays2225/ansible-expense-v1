- name: Configure Load Balancer
  hosts: lb
  become: yes
  tasks:
    - name: disable nginx
      command: dnf module disable nginx -y

    - name: enable 1.2x 
      command: dnf module enable nginx:1.26 -y

    - name: install nginx
      dnf:
        name:
        - nginx
        state: present

    - name: Remove nginx default config
      file:
        path: /etc/nginx/nginx.conf
        state: absent


    - name: Copy LB service
      template:
        src: lb.conf.j2
        dest: /etc/nginx/nginx.conf       

    - name: start and enable service
      service:
        name: nginx
        state: started
        enabled: yes